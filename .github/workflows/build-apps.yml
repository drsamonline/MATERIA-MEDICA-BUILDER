# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: LicenseRef-PolyForm-Perimeter-1.0.1
#
# That identifier covers this caller file, which is part of this repository and
# ships under its LICENSE. The workflow it calls below is third-party code from
# the app-builder kit, pinned at an exact commit and licensed on its own terms;
# nothing here relicenses it.
#
# This file is intentionally tiny: the whole pipeline lives in the public
# app-builder kit, so a fix there reaches every app at once. It used to be a
# 4.9 kB hand-copied workflow, and the copies drifted - one of them kept
# `if: always()` on the release job, which DELETED the published release before
# recreating it, so a failed build destroyed the release. Do not inline it again.
#
# What it does on every push to main:
#   build the portable EXE and the signed APK -> publish the rolling `app-latest`
#   release -> deploy the demo to Pages. All three come from the same commit, so
#   the live demo and the released build can never disagree.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@a1dfa124cbc55390598295a0c8be54dae33696c0   # was @main
    with:
      app_name: MATERIA-MEDICA-BUILDER
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job in build.yml dispatches the run that publishes its picture
      id-token: write
